name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Strict types, unit regressions, production build
        run: npm run check
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Browser regressions (desktop, mobile, WebKit)
        run: npm run test:e2e
      - name: Publish inspectable browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Publish Cloudflare Pages build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist/
          retention-days: 14
      - name: Archive machine-readable dependency audit
        if: always()
        run: npm audit --json > audit-current.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: audit-current.json
          retention-days: 14
      - name: Explain test scope
        run: |
          echo '## Verification scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests cover prompt construction, pasted/reviewed JSON, parser, playback, clipboard error handling, storage and responsive UI. They do not call an LLM API or prove future generated translations correct. Static artifact generation is not a Cloudflare deployment.' >> "$GITHUB_STEP_SUMMARY"
